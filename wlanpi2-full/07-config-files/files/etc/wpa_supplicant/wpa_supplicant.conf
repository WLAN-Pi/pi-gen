ap_scan=1
p2p_disabled=1

# Empty lines and lines starting with # are ignored
# Commented lines are indicated by octothrope (#) aka hash or pound sign.
# Remove the # from the beginning of line to uncomment a line.

# Uncomment the following two lines to enable a control interface
#ctrl_interface=/run/wpa_supplicant
#ctrl_interface_group=0
#update_config=1 # allow wpa_supplicant to overwrite configuration
#country=US  # ISO/IEC alpha2 country code

##########
# TWEAKS #
##########

# SSID scan technique is by default 0 using broadcast Probe Request frames. 1 is a directed Probe Request frame.
# If ESSID is "hidden", set scan_ssid to 1.

#network={
# scan_ssid=1
#}

# MAC address policy default
# 0 = use permanent MAC address
# 1 = use random MAC address for each ESS connection
# 2 = like 1, but maintain OUI (with local admin bit set)
#
# By default, permanent MAC address is used unless policy is changed by
# the per-network mac_addr parameter. Global mac_addr=1 can be used to
# change this default behavior.
#mac_addr=0

# wpa_supplicant v2.11 config options: https://w1.fi/cgit/hostap/tree/wpa_supplicant/wpa_supplicant.conf?h=hostap_2_11
# wpa_supplicant v2.10 config options: https://w1.fi/cgit/hostap/tree/wpa_supplicant/wpa_supplicant.conf?h=hostap_2_10

#######
# OKC #
#######

# Opportunistic Key Caching (also known as Proactive Key Caching) default
# This parameter can be used to set the default behavior for the
# proactive_key_caching parameter. By default, OKC is disabled unless enabled
# with the global okc=1 parameter or with the per-network
# proactive_key_caching=1 parameter. With okc=1, OKC is enabled by default, but
# can be disabled with per-network proactive_key_caching=0 parameter.
#okc=0

