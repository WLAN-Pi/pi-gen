name: Docker Example

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Docker container
        run: |
          docker run --rm \
            -e GITHUB_OUTPUT=/github/workspace/output.txt \
            my-image \
            /bin/bash -c "echo 'my_output=hello world' >> $GITHUB_OUTPUT"

      - name: Use the output
        run: echo "${{ steps.run-docker-container.outputs.my_output }}"