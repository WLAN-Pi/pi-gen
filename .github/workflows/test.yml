name: Docker Example

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker container
        id: run-docker-container
        run: |
          docker run --rm \
            -e GITHUB_ENV=/github/workspace/output.env \
            alpine \
            /bin/sh -c "echo 'my_output=hello world' >> $GITHUB_ENV"
        
      - name: Load output as environment variable
        run: source /github/workspace/output.env

      - name: Use the output
        run: echo "$my_output"