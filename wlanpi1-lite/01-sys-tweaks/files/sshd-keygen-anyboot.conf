[Unit]
# Host keys are deleted from the image at build time. Trixie's
# raspberrypi-sys-mods masks regenerate_ssh_host_keys.service and instead
# ships sshd-keygen.service gated on ConditionFirstBoot=yes — but on the Go,
# wlanpi-config-at-startup can reboot before sshd-keygen runs, consuming the
# one first boot and leaving sshd without host keys forever. Regenerate on
# any boot where the keys are missing instead.
# Note: an empty ConditionFirstBoot= resets ALL conditions, so the unit's
# other conditions are restated below.
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
